[project]
name = "ateam"
version = "0.1.0"
description = "ATeam: a self-hosted digital workforce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
