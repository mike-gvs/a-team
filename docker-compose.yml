name: ateam

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ateam}
      POSTGRES_DB: ${POSTGRES_DB:-ateam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ateam-local-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ateam} -d ${POSTGRES_DB:-ateam}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ateam-app:${IMAGE_TAG:-0.1.0-dev}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ateam}:${POSTGRES_PASSWORD:-ateam-local-dev}@postgres:5432/${POSTGRES_DB:-ateam}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ateam}
      POSTGRES_DB: ${POSTGRES_DB:-ateam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ateam-local-dev}
      ATEAM_SECRET_KEY: ${ATEAM_SECRET_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      POSTMARK_API_TOKEN: ${POSTMARK_API_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      VERSION: ${VERSION:-0.1.0}
      IMAGE_TAG: ${IMAGE_TAG:-0.1.0-dev}
    volumes:
      - ./config:/app/config
      - ./skills:/app/skills
      - ./prompts:/app/prompts
      - ./static:/app/static
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ateam-nginx:${IMAGE_TAG:-0.1.0-dev}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${ATEAM_PORT:-8080}:80"
    volumes:
      - ./packages/gvs-ui:/usr/share/nginx/html/gvs-ui:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24.2
    profiles: ["workflows"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ateam}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-ateam-local-dev}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: ["workflows"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      - temporal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  langfuse:
    image: langfuse/langfuse:2.95.8
    profiles: ["tracing"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ateam}:${POSTGRES_PASSWORD:-ateam-local-dev}@postgres:5432/langfuse
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ${ATEAM_SECRET_KEY:-ateam-dev-session-key-not-for-production}
      SALT: ${ATEAM_SECRET_KEY:-ateam-dev-session-key-not-for-production}
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8

  tunnel:
    image: cloudflare/cloudflared:2024.11.1
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  postgres-data:
